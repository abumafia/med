<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shifokorlar - E-Tibbiyot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-5JL69NVS52"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-5JL69NVS52');
</script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'teal-gold': {
                            50: '#ecfdf5',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e'
                        },
                        'gold-accent': '#f59e0b'
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.6s ease-out forwards',
                        'stagger-fade': 'staggerFade 0.3s ease-out forwards',
                        'pulse-slow': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'spin-slow': 'spin 1s linear infinite',
                        'slide-in-right': 'slideInRight 0.5s ease-out forwards',
                        'luxury-glow': 'luxuryGlow 2s ease-in-out infinite alternate'
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        staggerFade: {
                            '0%': { opacity: '0', transform: 'scale(0.95)' },
                            '100%': { opacity: '1', transform: 'scale(1)' }
                        },
                        slideInRight: {
                            '0%': { transform: 'translateX(100%)', opacity: '0' },
                            '100%': { transform: 'translateX(0)', opacity: '1' }
                        },
                        luxuryGlow: {
                            '0%': { boxShadow: '0 0 10px rgba(245, 158, 11, 0.3), 0 0 20px rgba(20, 184, 166, 0.2)' },
                            '100%': { boxShadow: '0 0 20px rgba(245, 158, 11, 0.5), 0 0 30px rgba(20, 184, 166, 0.4)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .stagger-item:nth-child(1) { animation-delay: 0.1s; }
        .stagger-item:nth-child(2) { animation-delay: 0.2s; }
        .stagger-item:nth-child(3) { animation-delay: 0.3s; }
        .stagger-item:nth-child(4) { animation-delay: 0.4s; }
        .stagger-item:nth-child(5) { animation-delay: 0.5s; }
        .stagger-item:nth-child(6) { animation-delay: 0.6s; }
        .brand-text {
            background: linear-gradient(135deg, #14b8a6, #0d9488);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(20, 184, 166, 0.5);
        }
        .gold-glow {
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
        }
        .luxury-card {
            background: linear-gradient(145deg, #ffffff, #f8fafc);
            border: 1px solid rgba(245, 158, 11, 0.1);
            position: relative;
            overflow: hidden;
        }
        .luxury-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #14b8a6, #f59e0b);
        }
        .avatar-hover {
            transition: all 0.3s ease;
            border: 2px solid rgba(245, 158, 11, 0.2);
        }
        .avatar-hover:hover {
            border-color: #f59e0b;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
        }
        .field-focus {
            transform: scale(1.02);
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.2);
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-teal-gold-50 to-gray-50">
    <!-- Header -->
    <header class="bg-teal-600 text-white shadow-lg fixed w-full top-0 z-50 transition-all duration-300">
        <nav class="flex justify-between items-center p-4 max-w-7xl mx-auto">
            <div class="nav-brand flex items-center gap-2">
                <div class="w-8 h-8 bg-black rounded-full flex items-center justify-center gold-glow">
                    <span class="text-xs font-bold text-teal-gold-500">H</span>
                </div>
                <h2 class="text-xl md:text-2xl font-bold brand-text">E-Tibbiyot</h2>
            </div>
            <div class="nav-links hidden md:flex space-x-6">
                <a href="/index" class="hover:text-teal-200 transition-colors px-2 py-1 rounded">Asosiy</a>
                <a href="/doctor" class="hover:text-teal-200 transition-colors px-2 py-1 rounded bg-teal-700">Shifokorlar</a>
                <a href="/chatbot" class="hover:text-teal-200 transition-colors px-2 py-1 rounded">Chatbot</a>
                <a href="/create" class="hover:text-teal-200 transition-colors px-2 py-1 rounded">Post yaratish</a>
                <a href="/profile" class="hover:text-teal-200 transition-colors px-2 py-1 rounded">Profil</a>
                <a href="#" id="logoutBtn" class="bg-gold-accent hover:bg-amber-500 px-4 py-2 rounded transition-colors">Chiqish</a>
            </div>
            <!-- Mobile menu button -->
            <button class="md:hidden text-white" id="mobileMenuBtn">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </nav>
        <!-- Mobile menu -->
        <div id="mobileMenu" class="md:hidden hidden bg-teal-700 px-4 py-2 space-y-2">
            <a href="/index" class="block hover:bg-teal-600 px-3 py-2 rounded">Asosiy</a>
            <a href="/doctor" class="block hover:bg-teal-600 px-3 py-2 rounded bg-teal-500">Shifokorlar</a>
            <a href="/chatbot" class="block hover:bg-teal-600 px-3 py-2 rounded">Chatbot</a>
            <a href="/create" class="block hover:bg-teal-600 px-3 py-2 rounded">Post yaratish</a>
            <a href="/profile" class="block hover:bg-teal-600 px-3 py-2 rounded">Profil</a>
            <a href="#" id="mobileLogout" class="block bg-gold-accent hover:bg-amber-500 px-3 py-2 rounded text-center">Chiqish</a>
        </div>
    </header>

    <!-- Spacer for fixed header -->
    <div class="h-16 md:h-20"></div>

    <main class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- Header section -->
        <div class="doctors-header text-center mb-8 animate-fade-in-up">
            <h1 class="text-3xl md:text-4xl font-bold brand-text mb-2">Shifokorlar</h1>
            <p class="text-teal-600 text-lg font-semibold">Sizga kerakli mutaxassisni toping va sog'lig'ingizni ishonchli qo'llarga topshiring</p>
        </div>

        <!-- Search and filters -->
        <div class="search-filters flex flex-col md:flex-row gap-4 mb-8 luxury-card p-6 rounded-3xl shadow-xl gold-glow animate-slide-in-right">
            <input type="text" id="searchDoctors" placeholder="Shifokor nomi yoki mutaxassislik bo'yicha qidirish..." 
                   class="flex-1 p-4 border border-teal-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all bg-teal-50 text-lg">
            <select id="specializationFilter" class="p-4 border border-teal-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all bg-teal-50 md:w-80 text-lg">
                <option value="">Barcha mutaxassisliklar</option>
                <option value="Terapevt">Terapevt</option>
                <option value="Kardiolog">Kardiolog</option>
                <option value="Nevrolog">Nevrolog</option>
                <option value="Gastroenterolog">Gastroenterolog</option>
                <option value="Stomatolog">Stomatolog</option>
                <option value="Pediatr">Pediatr</option>
                <option value="Travmatolog">Travmatolog</option>
                <option value="Ginekolog">Ginekolog</option>
                <option value="Urolog">Urolog</option>
                <option value="Oftalmolog">Oftalmolog</option>
            </select>
            <button onclick="searchDoctors()" class="luxury-card inline-flex items-center gap-2 bg-gradient-to-r from-teal-600 to-teal-700 hover:from-teal-700 hover:to-teal-800 text-white px-10 py-4 rounded-2xl font-semibold transition-all shadow-lg hover:shadow-xl animate-pulse-slow text-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                Qidirish
            </button>
        </div>

        <!-- Loading spinner -->
        <div id="loading" class="hidden text-center py-12">
            <div class="inline-block animate-spin-slow rounded-full h-16 w-16 border-b-2 border-teal-600 border-t-2 border-gold-accent mx-auto mb-4"></div>
            <p class="text-teal-600 font-semibold text-xl">Shifokorlar yuklanmoqda...</p>
        </div>

        <!-- Doctors grid -->
        <div id="doctorsContainer" class="doctors-grid grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 space-y-6">
            <!-- Shifokorlar ro'yxati stagger animatsiya bilan -->
        </div>
    </main>

    <!-- Qabul modal -->
    <div id="appointmentModal" class="modal fixed inset-0 bg-black/60 flex items-center justify-center z-50 hidden p-4 backdrop-blur-sm">
        <div class="modal-content luxury-card rounded-3xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto relative gold-glow animate-fade-in-up">
            <span class="close absolute top-4 right-4 text-gray-500 hover:text-gray-700 text-3xl cursor-pointer z-10 font-bold transition-colors">&times;</span>
            <div id="appointmentForm" class="p-8">
                <!-- Qabul formasi -->
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://med-uz.onrender.com';
        let currentUser = null;
        let doctors = [];

        // Mobile menu setup
        function setupMobileMenu() {
            const btn = document.getElementById('mobileMenuBtn');
            const menu = document.getElementById('mobileMenu');
            btn.addEventListener('click', () => {
                menu.classList.toggle('hidden');
            });
        }

        // Loading ko'rsatish/yashirish
        function showLoading(show) {
            document.getElementById('loading').classList.toggle('hidden', !show);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            setupMobileMenu();
            const token = localStorage.getItem('token');
            const userData = localStorage.getItem('user');
            
            if (!token || !userData) {
                window.location.href = '/';
                return;
            }
            
            currentUser = JSON.parse(userData);
            showLoading(true);
            await loadDoctors();
            showLoading(false);
        });

        async function loadDoctors(search = '', specialization = '') {
            try {
                const token = localStorage.getItem('token');
                let url = `${API_BASE}/api/doctors`;
                
                if (search || specialization) {
                    url += `?search=${encodeURIComponent(search)}&specialization=${encodeURIComponent(specialization)}`;
                }
                
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    doctors = await response.json();
                    displayDoctors();
                } else {
                    throw new Error('Shifokorlarni yuklab bo\'lmadi');
                }
            } catch (error) {
                console.error('Xatolik:', error);
                alert('Shifokorlarni yuklab bo\'lmadi');
            }
        }

        function displayDoctors() {
            const container = document.getElementById('doctorsContainer');
            container.innerHTML = '';

            doctors.forEach((doctor, index) => {
                const doctorElement = document.createElement('div');
                doctorElement.className = 'doctor-card luxury-card rounded-3xl overflow-hidden hover:shadow-2xl transition-all duration-500 hover:-translate-y-1 stagger-item animate-stagger-fade opacity-0 cursor-pointer';
                doctorElement.style.animationDelay = (index % 6) * 0.1 + 's';
                doctorElement.innerHTML = `
                    <div class="doctor-header p-8 bg-gradient-to-r from-teal-50 via-white to-gold-accent/10 border-b border-teal-100">
                        <div class="flex items-center gap-4">
                            <img src="${doctor.profile.avatar || 'https://via.placeholder.com/150x150/14b8a6/ffffff?text=D'}" 
                                 alt="Avatar" class="avatar w-20 h-20 rounded-full object-cover avatar-hover"
                                 onerror="this.src='https://via.placeholder.com/150x150/14b8a6/ffffff?text=D'">
                            <div class="flex-1 min-w-0">
                                <h3 class="text-2xl font-bold text-gray-800 mb-1 truncate">${doctor.profile.firstName} ${doctor.profile.lastName}</h3>
                                <p class="text-teal-600 font-semibold text-lg mb-2">${doctor.profile.specialization}</p>
                                <p class="text-gray-600 flex items-center gap-2 text-sm"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg> ${doctor.profile.location || 'Manzil ko\'rsatilmagan'}</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="doctor-stats p-6 bg-gradient-to-b from-gray-50 to-white">
                        <div class="flex justify-between items-center mb-4">
                            <span class="text-yellow-500 flex items-center gap-1 text-lg font-bold">⭐ ${(doctor.profile.rating || 0).toFixed(1)}</span>
                            <span class="text-green-600 font-semibold text-lg">✅ ${doctor.profile.successfulCases || 0} muvaffaqiyatli</span>
                        </div>
                        <div class="flex items-center gap-3 text-sm text-gray-600 divide-x divide-gray-300">
                            <div class="flex items-center gap-2 pr-4">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                                ${doctor.profile.phone || 'Telefon raqami ko\'rsatilmagan'}
                            </div>
                            <div class="flex items-center gap-2 pl-4">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                                ${doctor.email || 'Email ko\'rsatilmagan'}
                            </div>
                        </div>
                    </div>
                    
                    <div class="doctor-actions p-6">
                        <button onclick="viewProfile('${doctor._id}')" class="w-full luxury-card inline-flex items-center gap-2 bg-gray-100 hover:bg-gray-200 text-gray-700 py-4 px-6 rounded-2xl font-semibold transition-all mb-3">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
                            </svg>
                            Profil ko'rish
                        </button>
                        <button onclick="bookAppointment('${doctor._id}')" class="w-full luxury-card inline-flex items-center gap-2 bg-gradient-to-r from-teal-600 to-teal-700 hover:from-teal-700 hover:to-teal-800 text-white py-4 px-6 rounded-2xl font-semibold transition-all shadow-lg hover:shadow-xl animate-pulse-slow">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                            </svg>
                            Qabulga yozilish
                        </button>
                    </div>
                `;
                // Animatsiyani boshlash
                setTimeout(() => doctorElement.classList.remove('opacity-0'), 10);
                container.appendChild(doctorElement);
            });
        }

        function viewProfile(doctorId) {
            window.location.href = `/profile?id=${doctorId}`;
        }

        function bookAppointment(doctorId) {
            const doctor = doctors.find(d => d._id === doctorId);
            if (!doctor) return;

            const modal = document.getElementById('appointmentModal');
            const form = document.getElementById('appointmentForm');
            
            form.innerHTML = `
                <h3 class="text-3xl font-bold text-gray-800 mb-6 brand-text text-center">Qabulga yozilish</h3>
                <div class="luxury-card bg-gradient-to-r from-teal-50 to-teal-100 p-6 rounded-2xl mb-6 border border-teal-200">
                    <p class="font-bold text-gray-800 mb-2 text-lg"><strong>Shifokor:</strong> ${doctor.profile.firstName} ${doctor.profile.lastName}</p>
                    <p class="text-teal-600 mb-2 text-lg"><strong>Mutaxassislik:</strong> ${doctor.profile.specialization}</p>
                    <p class="text-gray-600 flex items-center gap-2 text-lg"><strong>Reyting:</strong> ⭐ ${(doctor.profile.rating || 0).toFixed(1)}</p>
                </div>
                
                <form onsubmit="submitAppointment(event, '${doctorId}')" class="space-y-6">
                    <div class="form-group">
                        <label class="block text-lg font-semibold text-gray-700 mb-3">Sana</label>
                        <input type="date" id="appointmentDate" required 
                               min="${new Date().toISOString().split('T')[0]}" 
                               class="w-full p-4 border border-teal-300 rounded-2xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all field-focus">
                    </div>
                    
                    <div class="form-group">
                        <label class="block text-lg font-semibold text-gray-700 mb-3">Vaqt</label>
                        <select id="appointmentTime" required class="w-full p-4 border border-teal-300 rounded-2xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all field-focus text-lg">
                            <option value="">Vaqtni tanlang</option>
                            <option value="09:00">09:00</option>
                            <option value="10:00">10:00</option>
                            <option value="11:00">11:00</option>
                            <option value="14:00">14:00</option>
                            <option value="15:00">15:00</option>
                            <option value="16:00">16:00</option>
                            <option value="22:50">22:50</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="block text-lg font-semibold text-gray-700 mb-3">Qo'shimcha ma'lumot</label>
                        <textarea id="appointmentNotes" rows="4" 
                                  placeholder="Shikoyatlaringiz yoki qo'shimcha ma'lumotlar..." 
                                  class="w-full p-4 border border-teal-300 rounded-2xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all field-focus resize-none text-lg"></textarea>
                    </div>
                    
                    <button type="submit" class="w-full luxury-card inline-flex items-center gap-2 bg-gradient-to-r from-teal-600 to-teal-700 hover:from-teal-700 hover:to-teal-800 text-white py-4 px-6 rounded-2xl font-semibold transition-all shadow-lg hover:shadow-xl animate-pulse-slow text-lg">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                        Qabulga yozilish
                    </button>
                </form>
            `;
            
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        async function submitAppointment(event, doctorId) {
            event.preventDefault();
            
            const date = document.getElementById('appointmentDate').value;
            const time = document.getElementById('appointmentTime').value;
            const notes = document.getElementById('appointmentNotes').value;
            
            if (!date || !time) {
                alert('Sana va vaqtni tanlang!');
                return;
            }
            
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_BASE}/api/appointments`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        doctor: doctorId,
                        date,
                        time,
                        notes
                    })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    alert('Qabul muvaffaqiyatli yaratildi! ID: ' + result._id);
                    document.getElementById('appointmentModal').classList.add('hidden');
                    document.body.style.overflow = 'auto';
                } else {
                    const error = await response.json();
                    throw new Error(error.message || 'Qabul yaratishda xatolik');
                }
            } catch (error) {
                console.error('Xatolik:', error);
                alert('Qabul yaratishda xatolik yuz berdi: ' + error.message);
            }
        }

        function searchDoctors() {
            const search = document.getElementById('searchDoctors').value;
            const specialization = document.getElementById('specializationFilter').value;
            showLoading(true);
            loadDoctors(search, specialization);
        }

        // Enter tugmasi bilan qidirish
        document.getElementById('searchDoctors').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchDoctors();
            }
        });

        // Modal yopish
        document.addEventListener('click', (e) => {
            const modal = document.getElementById('appointmentModal');
            if (e.target === modal) {
                modal.classList.add('hidden');
                document.body.style.overflow = 'auto';
            }
        });
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('close')) {
                document.getElementById('appointmentModal').classList.add('hidden');
                document.body.style.overflow = 'auto';
            }
        });

        // Chiqish
        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/';
        });
        document.getElementById('mobileLogout').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/';
        });
    </script>
</body>
</html>
