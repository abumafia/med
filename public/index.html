<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Har bir sahifa uchun unique meta teglar -->
<meta name="description" content="Hallaym Tibbiyot - Sog'lig'ingizni ishonchli qo'llarga topshiring. Shifokorlar bilan onlayn maslahat, tibbiy chatbot va sog'liq haqida ma'lumotlar">
<meta name="keywords" content="tibbiyot, shifokor, online davolash, sog'liq, kasallik, dori, maslahat, O'zbekiston">
<meta property="og:title" content="Hallaym Tibbiyot - Online Tibbiy Platforma">
<meta property="og:description" content="Sog'lig'ingiz uchun ishonchli platforma">
<meta property="og:image" content="https://res.cloudinary.com/dh3heagct/image/upload/v1767760612/uploadsx/file.jpg">
<meta name="robots" content="index, follow">
    <title>Asosiy sahifa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5JL69NVS52"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      gtag('config', 'G-5JL69NVS52');

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'teal-gold': {
                            50: '#ecfdf5',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e'
                        },
                        'gold-accent': '#f59e0b'
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.6s ease-out forwards',
                        'stagger-fade': 'staggerFade 0.3s ease-out forwards',
                        'pulse-slow': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'spin-slow': 'spin 1s linear infinite',
                        'luxury-glow': 'luxuryGlow 2s ease-in-out infinite alternate',
                        'image-hover': 'imageHover 0.4s ease-out forwards'
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        staggerFade: {
                            '0%': { opacity: '0', transform: 'scale(0.95)' },
                            '100%': { opacity: '1', transform: 'scale(1)' }
                        },
                        luxuryGlow: {
                            '0%': { boxShadow: '0 0 10px rgba(245, 158, 11, 0.3), 0 0 20px rgba(20, 184, 166, 0.2)' },
                            '100%': { boxShadow: '0 0 20px rgba(245, 158, 11, 0.5), 0 0 30px rgba(20, 184, 166, 0.4)' }
                        },
                        imageHover: {
                            '0%': { transform: 'scale(1)', filter: 'brightness(1)' },
                            '100%': { transform: 'scale(1.02)', filter: 'brightness(1.1)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .stagger-item:nth-child(1) { animation-delay: 0.1s; }
        .stagger-item:nth-child(2) { animation-delay: 0.2s; }
        .stagger-item:nth-child(3) { animation-delay: 0.3s; }
        .stagger-item:nth-child(4) { animation-delay: 0.4s; }
        .stagger-item:nth-child(5) { animation-delay: 0.5s; }
        .stagger-item:nth-child(6) { animation-delay: 0.6s; }
        .brand-text {
            background: linear-gradient(135deg, #14b8a6, #0d9488);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(20, 184, 166, 0.5);
        }
        .gold-glow {
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
        }
        .luxury-card {
            background: linear-gradient(145deg, #ffffff, #f8fafc);
            border: 1px solid rgba(245, 158, 11, 0.1);
            position: relative;
            overflow: hidden;
        }
        .luxury-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #14b8a6, #f59e0b);
        }
        .profile-img {
            transition: all 0.3s ease;
            border: 2px solid rgba(245, 158, 11, 0.2);
        }
        .profile-img:hover {
            border-color: #f59e0b;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
        }
        .post-image {
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
        }
        .post-image:hover {
            animation: imageHover 0.4s ease-out forwards;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        .post-image::after {
            content: '📷';
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 4px 8px;
            border-radius: 50%;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .post-image:hover::after {
            opacity: 1;
        }
        .modal-image {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }
        .modal-image:hover {
            transform: scale(1.02);
        }
        .comment-bubble {
            position: relative;
            background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
            border-left: 4px solid #14b8a6;
        }
        .comment-bubble::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 10px;
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-right: 12px solid #14b8a6;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-teal-gold-50 to-gray-50">
    <!-- Header -->
    <header class="bg-teal-600 text-white shadow-lg fixed w-full top-0 z-50 transition-all duration-300">
        <nav class="flex justify-between items-center p-4 max-w-7xl mx-auto">
            <div class="nav-brand flex items-center gap-2">
                <div class="w-8 h-8 bg-black rounded-full flex items-center justify-center gold-glow">
                    <span class="text-xs font-bold text-teal-gold-500">H</span>
                </div>
                <h2 class="text-xl md:text-2xl font-bold brand-text">E-Tibbiyot</h2>
            </div>
            <div class="nav-links hidden md:flex space-x-6">
                <a href="/index" class="hover:text-teal-200 transition-colors px-2 py-1 rounded">Asosiy</a>
                <a href="/doctor" class="hover:text-teal-200 transition-colors px-2 py-1 rounded">Shifokorlar</a>
                <a href="/chatbot" class="hover:text-teal-200 transition-colors px-2 py-1 rounded">Chatbot</a>
                <a href="/create" class="hover:text-teal-200 transition-colors px-2 py-1 rounded">Post yaratish</a>
                <a href="/profile" class="hover:text-teal-200 transition-colors px-2 py-1 rounded">Profil</a>
                <a href="#" id="logoutBtn" class="bg-gold-accent hover:bg-amber-500 px-4 py-2 rounded transition-colors">Chiqish</a>
            </div>
            <!-- Mobile menu button -->
            <button class="md:hidden text-white" id="mobileMenuBtn">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </nav>
        <!-- Mobile menu -->
        <div id="mobileMenu" class="md:hidden hidden bg-teal-700 px-4 py-2 space-y-2">
            <a href="/index" class="block hover:bg-teal-600 px-3 py-2 rounded">Asosiy</a>
            <a href="/doctor" class="block hover:bg-teal-600 px-3 py-2 rounded">Shifokorlar</a>
            <a href="/chatbot" class="block hover:bg-teal-600 px-3 py-2 rounded">Chatbot</a>
            <a href="/create" class="block hover:bg-teal-600 px-3 py-2 rounded">Post yaratish</a>
            <a href="/profile" class="block hover:bg-teal-600 px-3 py-2 rounded">Profil</a>
            <a href="#" id="mobileLogout" class="block bg-gold-accent hover:bg-amber-500 px-3 py-2 rounded text-center">Chiqish</a>
        </div>
    </header>

    <!-- Spacer for fixed header -->
    <div class="h-16 md:h-20"></div>

    <main class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- Search Section -->
        <div class="search-section flex flex-col md:flex-row gap-4 mb-8 bg-white p-6 rounded-2xl shadow-xl gold-glow border border-teal-100">
            <input type="text" id="searchInput" placeholder="Postlar qidirish... (masalan: diabet)" 
                   class="flex-1 p-4 border border-teal-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all bg-teal-50">
            <select id="categoryFilter" class="p-4 border border-teal-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 bg-teal-50">
                <option value="">Barcha kategoriyalar</option>
                <option value="sog'liq">Sog'liq maslahatlari</option>
                <option value="dori">Dori vositalari</option>
                <option value="kasallik">Kasalliklar</option>
                <option value="tavsiya">Shifokor tavsiyalari</option>
            </select>
            <button onclick="searchPosts()" class="bg-gradient-to-r from-teal-600 to-teal-700 hover:from-teal-700 hover:to-teal-800 text-white px-8 py-4 rounded-xl font-semibold transition-all animate-pulse-slow shadow-lg hover:shadow-xl">🔍 Qidirish</button>
        </div>

        <!-- Posts Container -->
        <div id="postsContainer" class="posts-grid grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 space-y-6">
            <!-- Postlar shu yerda ko'rsatiladi -->
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="hidden text-center py-12">
            <div class="inline-block animate-spin-slow rounded-full h-12 w-12 border-b-2 border-teal-600 border-t-2 border-gold-accent"></div>
            <p class="text-teal-600 mt-4 font-semibold">Yuklanmoqda... Iltimos, kuting</p>
        </div>

        <!-- Load More Trigger -->
        <div id="loadMoreTrigger" class="h-20"></div>
    </main>

    <!-- Post Modal -->
    <div id="postModal" class="modal fixed inset-0 bg-black/60 flex items-center justify-center z-50 hidden p-4 backdrop-blur-sm">
        <div class="modal-content bg-white rounded-3xl shadow-2xl max-w-6xl w-full max-h-[95vh] overflow-y-auto relative gold-glow animate-fade-in-up">
            <span class="close absolute top-4 right-4 text-gray-500 hover:text-gray-700 text-3xl cursor-pointer z-10 font-bold transition-colors">&times;</span>
            <div id="postDetails" class="p-8">
                <!-- Post tafsilotlari -->
            </div>
        </div>
    </div>

    <!-- Image Lightbox Modal -->
    <div id="imageModal" class="fixed inset-0 bg-black/90 flex items-center justify-center z-50 hidden p-4">
        <div class="relative max-w-4xl w-full max-h-[90vh] flex items-center justify-center">
            <span class="close-image absolute top-4 right-4 text-white text-3xl cursor-pointer z-10 hover:text-gray-300 transition-colors">&times;</span>
            <img id="lightboxImage" src="" alt="To'liq rasm" class="modal-image max-h-full max-w-full object-contain rounded-2xl">
        </div>
    </div>

    <script>
        const API_BASE = 'https://med-uz.onrender.com';
        let currentUser = null;
        let posts = [];
        let currentPage = 1;
        let hasMore = true;
        let isLoading = false;
        let searchTerm = '';
        let categoryFilter = '';

        // Default avatar URL
        const DEFAULT_AVATAR = 'https://via.placeholder.com/150x150/14b8a6/ffffff?text=U';

        // Sahifa yuklanganda
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            const userData = localStorage.getItem('user');
            
            if (!token || !userData) {
                window.location.href = 'register-login.html';
                return;
            }
            
            currentUser = JSON.parse(userData);
            await loadPosts(1, '', '');
            setupInfiniteScroll();
            setupMobileMenu();
            setupModalEvents();
        });

        // Infinite Scroll o'rnatish
        function setupInfiniteScroll() {
            const trigger = document.getElementById('loadMoreTrigger');
            const observer = new IntersectionObserver(async (entries) => {
                if (entries[0].isIntersecting && hasMore && !isLoading) {
                    currentPage++;
                    await loadPosts(currentPage, searchTerm, categoryFilter, true);
                }
            }, { threshold: 0.1 });
            observer.observe(trigger);
        }

        // Postlarni yuklash
        async function loadPosts(page = 1, search = '', category = '', append = false) {
            if (isLoading) return;
            isLoading = true;
            showLoading(true);

            try {
                const token = localStorage.getItem('token');
                let url = `${API_BASE}/api/posts?page=${page}&limit=6&search=${encodeURIComponent(search)}&category=${encodeURIComponent(category)}`;
                
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    const newPosts = await response.json();
                    hasMore = newPosts.length === 6;

                    if (append) {
                        posts = [...posts, ...newPosts];
                        await appendPostsWithAnimation(newPosts);
                    } else {
                        posts = newPosts;
                        currentPage = 1;
                        displayPostsWithAnimation(newPosts);
                    }
                } else {
                    if (response.status === 401) {
                        localStorage.removeItem('token');
                        localStorage.removeItem('user');
                        window.location.href = 'register-login.html';
                        return;
                    }
                    throw new Error('Postlarni yuklab bo\'lmadi');
                }
            } catch (error) {
                console.error('Xatolik:', error);
                console.log('Postlarni yuklab bo\'lmadi: ', error.message);
                hasMore = false;
            } finally {
                isLoading = false;
                showLoading(false);
            }
        }

        // Loading ko'rsatish/yashirish
        function showLoading(show) {
            const loading = document.getElementById('loading');
            loading.classList.toggle('hidden', !show);
        }

        // Postlarni animatsiya bilan ko'rsatish (stagger)
        async function displayPostsWithAnimation(postsToShow) {
            const container = document.getElementById('postsContainer');
            container.innerHTML = '';
            for (let i = 0; i < postsToShow.length; i++) {
                await new Promise(resolve => setTimeout(resolve, 100));
                appendPostWithAnimation(postsToShow[i], i);
            }
        }

        // Yangi postlarni animatsiya bilan qo'shish
        async function appendPostsWithAnimation(newPosts) {
            for (let i = 0; i < newPosts.length; i++) {
                await new Promise(resolve => setTimeout(resolve, 150));
                appendPostWithAnimation(newPosts[i], posts.length - newPosts.length + i);
            }
        }

        // Bitta postni animatsiya bilan qo'shish
        function appendPostWithAnimation(post, index) {
            const container = document.getElementById('postsContainer');
            const postElement = createPostElement(post);
            postElement.classList.add('stagger-item', 'animate-stagger-fade', 'opacity-0', 'luxury-card');
            postElement.style.animationDelay = (index % 6) * 0.1 + 's';
            container.appendChild(postElement);
            setTimeout(() => postElement.classList.remove('opacity-0'), 10);
            postElement.classList.add('animate-luxury-glow');
        }

        // Post elementini yaratish (yaxshilangan dizayn, URL to'g'rilandi)
        function createPostElement(post) {
            // Avatar URL: Cloudinary to'liq URL yoki default
            const avatarUrl = post.author.profile.avatar || DEFAULT_AVATAR;
            
            // Post image URL: Cloudinary to'liq URL yoki bo'sh
            const imageUrl = post.image || '';
            
            const postElement = document.createElement('div');
            postElement.className = 'post-card rounded-2xl overflow-hidden hover:shadow-2xl transition-all duration-500 hover:-translate-y-2 animate-fade-in-up cursor-pointer';
            postElement.innerHTML = `
                <div class="post-header flex items-center gap-4 p-6 bg-gradient-to-r from-teal-50 via-white to-gold-accent/10 border-b border-teal-100">
                    <img src="${avatarUrl}" 
                         alt="Avatar" class="profile-img w-12 h-12 rounded-full object-cover cursor-pointer"
                         onclick="viewProfile('${post.author._id}'); event.stopPropagation();"
                         onerror="this.src='${DEFAULT_AVATAR}'">
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-gray-800 truncate text-lg">${post.author.profile.firstName} ${post.author.profile.lastName}</h4>
                        <small class="text-teal-600 font-medium">@${post.author.username}</small>
                    </div>
                    <div class="text-xs text-gray-500">${new Date(post.createdAt).toLocaleDateString('uz-UZ')}</div>
                </div>
                ${imageUrl ? `<div class="post-image relative overflow-hidden">
                    <img src="${imageUrl}" class="w-full h-56 object-cover" 
                         onclick="openImageModal('${imageUrl}'); event.stopPropagation();"
                         onerror="this.onerror=null; this.src='https://via.placeholder.com/300x200/14b8a6/ffffff?text=No+Image'; this.alt='Rasm yuklanmadi';">
                </div>` : ''}
                <div class="p-6">
                    <h3 class="text-xl font-bold text-gray-900 mb-3 leading-tight">${post.title}</h3>
                    <p class="text-gray-600 mb-6 line-clamp-4 leading-relaxed text-sm">${post.content}</p>
                    <div class="post-actions flex justify-between items-center mb-4">
                        <div class="flex gap-6">
                            <button onclick="toggleLike('${post._id}'); event.stopPropagation();" class="like-btn flex items-center gap-2 text-teal-600 hover:text-red-500 transition-all font-medium ${post.likes.includes(currentUser.id) ? 'text-red-500' : ''}">
                                <span class="text-lg">❤️</span> ${post.likes.length}
                            </button>
                            <button onclick="showComments('${post._id}'); event.stopPropagation();" class="comment-btn flex items-center gap-2 text-teal-600 hover:text-teal-700 transition-all font-medium">
                                <span class="text-lg">💬</span> ${post.comments.length}
                            </button>
                            <button onclick="sharePost('${post._id}'); event.stopPropagation();" class="share-btn flex items-center gap-2 text-teal-600 hover:text-teal-700 transition-all font-medium">
                                <span class="text-lg">🔗</span> Ulashish
                            </button>
                        </div>
                    </div>
                    <div class="post-category flex justify-end">
                        <span class="inline-block bg-gradient-to-r from-gold-accent to-amber-500 text-white px-4 py-2 rounded-full text-sm font-semibold shadow-md">${post.category}</span>
                    </div>
                </div>
            `;
            // Butun kartani modalga ochish uchun
            postElement.addEventListener('click', () => showComments(post._id));
            return postElement;
        }

        // Rasm modalini ochish
        function openImageModal(imageUrl) {
            const modal = document.getElementById('imageModal');
            const lightboxImage = document.getElementById('lightboxImage');
            lightboxImage.src = imageUrl;
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        // Rasm modalini yopish
        document.getElementById('imageModal').addEventListener('click', (e) => {
            if (e.target.id === 'imageModal' || e.target.classList.contains('close-image')) {
                document.getElementById('imageModal').classList.add('hidden');
                document.body.style.overflow = 'auto';
            }
        });

        // Like bosish
        async function toggleLike(postId) {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_BASE}/api/posts/${postId}/like`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const result = await response.json();
                    await loadPosts(currentPage, searchTerm, categoryFilter, currentPage > 1);
                } else if (response.status === 401) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.href = 'register-login.html';
                }
            } catch (error) {
                console.error('Xatolik:', error);
            }
        }

        // Kommentariyalarni ko'rsatish (yaxshilangan dizayn, URL to'g'rilandi)
        async function showComments(postId) {
            const post = posts.find(p => p._id === postId);
            if (!post) return;

            const modal = document.getElementById('postModal');
            const details = document.getElementById('postDetails');
            
            // Avatar URL: Cloudinary to'liq URL yoki default
            const avatarUrl = post.author.profile.avatar || DEFAULT_AVATAR;
            // Post image URL: Cloudinary to'liq URL yoki bo'sh
            const imageUrl = post.image || '';
            
            details.innerHTML = `
                <div class="post-full">
                    <div class="post-header flex items-center gap-4 p-6 bg-gradient-to-r from-teal-50 via-white to-gold-accent/10 mb-6 rounded-2xl border border-teal-100">
                        <img src="${avatarUrl}" 
                             alt="Avatar" class="profile-img w-16 h-16 rounded-full object-cover cursor-pointer"
                             onclick="viewProfile('${post.author._id}');"
                             onerror="this.src='${DEFAULT_AVATAR}'">
                        <div class="flex-1">
                            <h4 class="font-bold text-gray-800 text-xl">${post.author.profile.firstName} ${post.author.profile.lastName}</h4>
                            <small class="text-teal-600 font-medium">@${post.author.username}</small>
                            <p class="text-gray-500 text-sm mt-1">${new Date(post.createdAt).toLocaleDateString('uz-UZ')}</p>
                        </div>
                    </div>
                    ${imageUrl ? `<div class="mb-6 overflow-hidden rounded-2xl shadow-lg">
                        <img src="${imageUrl}" class="w-full h-80 object-cover cursor-pointer" 
                             onclick="openImageModal('${imageUrl}');"
                             onerror="this.onerror=null; this.src='https://via.placeholder.com/600x400/14b8a6/ffffff?text=No+Image'; this.alt='Rasm yuklanmadi';">
                    </div>` : ''}
                    <h3 class="text-3xl font-bold text-gray-900 mb-4 leading-tight">${post.title}</h3>
                    <p class="text-gray-700 mb-8 leading-relaxed text-lg">${post.content}</p>
                    
                    <div class="comments-section">
                        <h4 class="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                            💬 Kommentariyalar (<span id="commentCount">${post.comments.length}</span>)
                        </h4>
                        <div class="comment-form flex gap-4 mb-8 p-5 bg-gradient-to-r from-teal-50 to-teal-100 rounded-2xl border border-teal-200">
                            <input type="text" id="commentText" placeholder="O'z fikringizni yozing..." class="flex-1 p-4 border border-teal-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 bg-white">
                            <button onclick="addComment('${post._id}')" class="bg-gradient-to-r from-teal-600 to-teal-700 hover:from-teal-700 hover:to-teal-800 text-white px-8 py-4 rounded-xl font-semibold transition-all shadow-lg">Yuborish</button>
                        </div>
                        <div class="comments-list space-y-5">
                            ${post.comments.map(comment => {
                                // Comment avatar URL
                                const commentAvatar = comment.user.profile.avatar || DEFAULT_AVATAR;
                                return `
                                <div class="comment comment-bubble p-5 rounded-2xl shadow-sm border border-teal-100">
                                    <div class="comment-header flex items-start gap-4 mb-3">
                                        <img src="${commentAvatar}" 
                                             alt="Avatar" class="profile-img w-10 h-10 rounded-full object-cover cursor-pointer mt-1 flex-shrink-0"
                                             onclick="viewProfile('${comment.user._id}');"
                                             onerror="this.src='${DEFAULT_AVATAR}'">
                                        <div class="flex-1 min-w-0">
                                            <div class="flex items-center gap-2">
                                                <strong class="text-gray-800 font-semibold">${comment.user.profile.firstName} ${comment.user.profile.lastName}</strong>
                                                <small class="text-gray-500">${new Date(comment.createdAt).toLocaleDateString('uz-UZ')}</small>
                                            </div>
                                            <p class="text-gray-700 leading-relaxed">${comment.text}</p>
                                        </div>
                                    </div>
                                    <button onclick="showReplyForm('${post._id}', '${comment._id}')" class="text-teal-600 hover:text-teal-700 text-sm font-medium transition-colors flex items-center gap-1">
                                        ↳ Javob berish
                                    </button>
                                    
                                    <div class="replies mt-4 ml-12 space-y-3">
                                        ${comment.replies.map(reply => {
                                            // Reply avatar URL
                                            const replyAvatar = reply.user.profile.avatar || DEFAULT_AVATAR;
                                            return `
                                            <div class="reply bg-white/80 p-4 rounded-xl shadow-sm border border-gray-200">
                                                <div class="comment-header flex items-center gap-3 mb-2">
                                                    <img src="${replyAvatar}" 
                                                         alt="Avatar" class="profile-img w-8 h-8 rounded-full object-cover cursor-pointer"
                                                         onclick="viewProfile('${reply.user._id}');"
                                                         onerror="this.src='${DEFAULT_AVATAR}'">
                                                    <div class="flex-1 min-w-0">
                                                        <strong class="text-sm text-gray-800 block truncate">${reply.user.profile.firstName} ${reply.user.profile.lastName}</strong>
                                                        <small class="text-gray-500 text-xs block">${new Date(reply.createdAt).toLocaleDateString('uz-UZ')}</small>
                                                    </div>
                                                </div>
                                                <p class="text-sm text-gray-700">${reply.text}</p>
                                            </div>
                                        `}).join('')}
                                    </div>
                                    
                                    <div id="replyForm-${comment._id}" class="reply-form mt-4 hidden flex gap-3 p-3 bg-gray-50 rounded-xl">
                                        <input type="text" id="replyText-${comment._id}" placeholder="Javob yozing..." class="flex-1 p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500">
                                        <button onclick="addReply('${post._id}', '${comment._id}')" class="bg-teal-600 hover:bg-teal-700 text-white px-6 py-3 rounded-lg transition-all font-medium">Yuborish</button>
                                    </div>
                                </div>
                            `}).join('')}
                        </div>
                        ${post.comments.length === 0 ? '<p class="text-center text-gray-500 italic py-8">Hozircha kommentariya yo\'q. Birinchisi bo\'ling!</p>' : ''}
                    </div>
                </div>
            `;
            
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        // Modal yopish
        function closeModal() {
            const modal = document.getElementById('postModal');
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // Dokument bo'ylab modal tashqarisini bosganda yopish
        document.addEventListener('click', (e) => {
            const modal = document.getElementById('postModal');
            if (e.target === modal) {
                closeModal();
            }
        });

        // Modal eventlarini o'rnatish
        function setupModalEvents() {
            // Modal ichidagi close tugmasi
            document.addEventListener('click', (e) => {
                if (e.target.classList.contains('close')) {
                    closeModal();
                }
            });
        }

        // Kommentariya qo'shish
        async function addComment(postId) {
            const text = document.getElementById('commentText').value;
            if (!text.trim()) return;

            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_BASE}/api/posts/${postId}/comment`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text })
                });
                
                if (response.ok) {
                    document.getElementById('commentText').value = '';
                    await loadPosts(currentPage, searchTerm, categoryFilter, currentPage > 1);
                    showComments(postId);
                } else if (response.status === 401) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.href = 'register-login.html';
                }
            } catch (error) {
                console.error('Xatolik:', error);
            }
        }

        // Javob formasi
        function showReplyForm(postId, commentId) {
            const form = document.getElementById(`replyForm-${commentId}`);
            form.classList.toggle('hidden');
        }

        // Javob qo'shish
        async function addReply(postId, commentId) {
            const text = document.getElementById(`replyText-${commentId}`).value;
            if (!text.trim()) return;

            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_BASE}/api/posts/${postId}/comment/${commentId}/reply`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text })
                });
                
                if (response.ok) {
                    document.getElementById(`replyText-${commentId}`).value = '';
                    await loadPosts(currentPage, searchTerm, categoryFilter, currentPage > 1);
                    showComments(postId);
                } else if (response.status === 401) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.href = 'register-login.html';
                }
            } catch (error) {
                console.error('Xatolik:', error);
            }
        }

        // Profilga o'tish
        function viewProfile(userId) {
            window.location.href = `/profile?id=${userId}`;
        }

        // Post ulashish
        function sharePost(postId) {
            const post = posts.find(p => p._id === postId);
            if (!post) return;

            const shareUrl = `${window.location.origin}/index?post=${postId}`;
            
            if (navigator.share) {
                navigator.share({
                    title: post.title,
                    text: post.content.substring(0, 100) + '...',
                    url: shareUrl
                });
            } else {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    alert('Havola nusxalandi! Do\'stlaringizga ulashing.');
                }).catch(() => {
                    alert('Havola nusxalanmadi. Qo\'lda nusxalang: ' + shareUrl);
                });
            }
        }

        // Qidiruv
        function searchPosts() {
            searchTerm = document.getElementById('searchInput').value;
            categoryFilter = document.getElementById('categoryFilter').value;
            loadPosts(1, searchTerm, categoryFilter, false);
        }

        // Chiqish
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'register-login.html';
        }

        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            logout();
        });
        document.getElementById('mobileLogout').addEventListener('click', (e) => {
            e.preventDefault();
            logout();
        });

        // Mobile menu
        function setupMobileMenu() {
            const btn = document.getElementById('mobileMenuBtn');
            const menu = document.getElementById('mobileMenu');
            btn.addEventListener('click', () => {
                menu.classList.toggle('hidden');
            });
        }

        // URL parametrlarini tekshirish (post havolasi)
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('post');
        if (postId) {
            (async () => {
                await loadPosts(1, '', '');
                const post = posts.find(p => p._id === postId);
                if (post) {
                    showComments(postId);
                }
            })();
        }
    </script>
</body>
</html>
